<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Port Container Truck Dispatch System</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
    background: #1a1a2e; color: #e0e0e0;
    display: flex; height: 100vh; overflow: hidden;
}
#sidebar {
    width: 320px; background: #16213e; padding: 16px;
    display: flex; flex-direction: column; gap: 12px;
    border-right: 2px solid #0f3460; overflow-y: auto;
}
#main-canvas {
    flex: 1; display: flex; align-items: center; justify-content: center;
    background: #0a0a1a;
}
canvas { display: block; }

h2 { color: #e94560; font-size: 18px; border-bottom: 1px solid #0f3460; padding-bottom: 8px; }
.stat-row { display: flex; justify-content: space-between; padding: 4px 0; font-size: 14px; }
.stat-val { color: #f0c040; font-weight: bold; }

button {
    padding: 8px 14px; border: none; border-radius: 6px;
    cursor: pointer; font-size: 13px; font-weight: 600;
    transition: background 0.2s;
}
.btn-group { display: flex; gap: 6px; flex-wrap: wrap; }
.btn-start { background: #2ecc71; color: #fff; }
.btn-start:hover { background: #27ae60; }
.btn-stop { background: #e74c3c; color: #fff; }
.btn-stop:hover { background: #c0392b; }
.btn-reset { background: #f39c12; color: #fff; }
.btn-reset:hover { background: #e67e22; }
.btn-task { background: #3498db; color: #fff; }
.btn-task:hover { background: #2980b9; }
.btn-mode { background: #9b59b6; color: #fff; font-size: 12px; padding: 6px 10px; }
.btn-mode:hover { background: #8e44ad; }

.slider-group { display: flex; align-items: center; gap: 8px; font-size: 13px; }
.slider-group input[type=range] { flex: 1; }

.metric-card {
    background: #0f3460; border-radius: 8px; padding: 10px;
    border-left: 3px solid #e94560;
}
.metric-card h4 { font-size: 12px; color: #aaa; margin-bottom: 4px; }
.metric-card .val { font-size: 22px; font-weight: bold; color: #f0c040; }

.task-list { max-height: 150px; overflow-y: auto; font-size: 12px; }
.task-item { padding: 3px 6px; background: #0f3460; margin: 2px 0; border-radius: 4px;
    display: flex; justify-content: space-between; }
.task-urgent { border-left: 3px solid #e74c3c; }

.truck-item { font-size: 12px; padding: 2px 6px; }
.truck-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }
</style>
</head>
<body>

<div id="sidebar">
    <h2>Port Dispatch Dashboard</h2>

    <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px;">
        <div class="metric-card"><h4>Completed</h4><div class="val" id="m-completed">0</div></div>
        <div class="metric-card"><h4>Pending</h4><div class="val" id="m-pending">0</div></div>
        <div class="metric-card"><h4>Avg Wait</h4><div class="val" id="m-wait">0s</div></div>
        <div class="metric-card"><h4>Utilization</h4><div class="val" id="m-util">0%</div></div>
    </div>

    <div class="btn-group">
        <button class="btn-start" onclick="toggleAuto()" id="btn-auto">▶ Start</button>
        <button class="btn-stop" onclick="stopAuto()">⏸ Stop</button>
        <button class="btn-reset" onclick="resetSim()">↺ Reset</button>
        <button class="btn-task" onclick="addTask()">+ Task</button>
        <button class="btn-task" onclick="stepOnce()">⏭ Step</button>
    </div>
    <div class="btn-group">
        <button class="btn-mode" id="btn-ml" onclick="toggleML()">ML: ON</button>
        <button class="btn-mode" id="btn-congestion" onclick="toggleCongestion()">Congestion: ON</button>
    </div>

    <div class="slider-group">
        <span>Speed:</span>
        <input type="range" min="0.01" max="0.2" step="0.01" value="0.05" id="speed-slider"
               onchange="setSpeed(this.value)">
        <span id="speed-label">0.05s</span>
    </div>

    <h3 style="font-size:14px;color:#aaa;">Pending Tasks</h3>
    <div class="task-list" id="task-list">--</div>

    <h3 style="font-size:14px;color:#aaa;">Trucks</h3>
    <div id="truck-list"></div>
</div>

<div id="main-canvas">
    <canvas id="port-canvas"></canvas>
</div>

<script src="/static/dashboard.js"></script>
</body>
</html>
